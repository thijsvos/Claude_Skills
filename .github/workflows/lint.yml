name: Lint Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install schema validator
        run: pip install 'check-jsonschema==0.37.2'
      - name: Run skill linter
        run: bash lint.sh

  # Second opinion from Claude Code's own validator: it parses every SKILL.md
  # with the real frontmatter parser and validates the plugin manifest. No
  # authentication needed. Strict on skills/ so an unrecognized field fails the
  # build; non-strict on the repo root because the validator warns that the
  # development CLAUDE.md "is not loaded as plugin context" — true, and intended.
  plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI
        run: npm install -g '@anthropic-ai/claude-code@2.1.263'
      - name: Validate skills (strict)
        run: claude plugin validate ./skills --strict
      - name: Validate plugin manifest
        run: claude plugin validate .
